name: Check Godot Preview Releases

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/check-release.yml'
      - '.github/workflows/release.yml'
      - 'Dockerfile'
  schedule:
    # GitHub schedules are best-effort; official releases cannot trigger other repos directly.
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      godot_tag:
        description: 'Optional official Godot preview tag (e.g. 4.8-beta1); blank means latest'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: godot-preview-check
  cancel-in-progress: false

jobs:
  detect:
    name: Find unpublished Godot preview
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.detect.outputs.tag }}
    steps:
      - name: Discover official preview release
        id: detect
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.godot_tag }}
        run: |
          set -euo pipefail

          tag="$REQUESTED_TAG"
          if [[ -z "$tag" ]]; then
            # The /releases/latest endpoint omits prereleases. Use the full feed.
            tag="$(gh api 'repos/godotengine/godot-builds/releases?per_page=100' \
              --jq '[.[] | select(.draft == false and .prerelease == true)
                          | select(.tag_name | test("^[0-9]+\\.[0-9]+(\\.[0-9]+)?-(dev|alpha|beta|rc)[0-9]+$"))]
                    | sort_by(.published_at) | last | .tag_name // empty')"
          fi

          if [[ -z "$tag" ]]; then
            echo 'No official Godot preview release found.'
            exit 0
          fi

          if ! [[ "$tag" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?-(dev|alpha|beta|rc)[0-9]+$ ]]; then
            echo "Unsupported preview tag: $tag" >&2
            exit 1
          fi

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Fork release $tag already exists; image should already be published."
            echo "To rebuild it, dispatch the Build Godot Preview Image workflow."
            exit 0
          fi

          # Do not create releases/tags for nonexistent upstream versions.
          gh api "repos/godotengine/godot-builds/releases/tags/$tag" \
            --jq '.prerelease' | grep -qx true

          echo "New upstream preview: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    name: Build and publish discovered preview
    needs: detect
    if: ${{ needs.detect.outputs.tag != '' }}
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/release.yml
    with:
      godot_tag: ${{ needs.detect.outputs.tag }}
      update_preview: true
